name: Release

# Push a tag like v0.1.0 to build all platforms and publish a GitHub release.
# Run manually (workflow_dispatch) to just build and upload the artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libssl-dev libzstd-dev libasound2-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev

      - name: Test
        # Includes the control server: Unix socket / Windows named pipe (owner-only
        # DACL, squatting refused) and the WSL hand-off (Linux).
        run: cargo test --locked -p dbclaw-core -p dbclaw-control --features dbclaw-control/server

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p dbclaw-app -p dbclaw-control

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "archive=db-claw-v$v-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # .dmg to install, .app.tar.gz for in-app updates.
        run: scripts/package-macos.sh target/${{ matrix.target }}/release ${{ steps.version.outputs.version }} dist ${{ steps.version.outputs.archive }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        # .AppImage (installs + in-app updates) and a plain .tar.gz.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
        run: |
          curl -fsSL -o "$APPIMAGETOOL" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x "$APPIMAGETOOL"
          scripts/package-linux.sh target/${{ matrix.target }}/release dist ${{ steps.version.outputs.archive }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        # Inno Setup installer (installs + in-app updates) and a portable zip.
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $numeric = ($v -split '-')[0]
          $archive = "${{ steps.version.outputs.archive }}"
          $bin = (Resolve-Path "target/${{ matrix.target }}/release").Path
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $out = (Resolve-Path dist).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" "/DNumericVersion=$numeric" "/DBinDir=$bin" "/DOutDir=$out" "/DOutName=$archive-setup" packaging\windows\dbclaw.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          New-Item -ItemType Directory -Force -Path "dist/$archive" | Out-Null
          Copy-Item "$bin/dbclaw.exe", "$bin/dbclaw-ctl.exe", "README.md", "LICENSE" "dist/$archive/"
          Compress-Archive -Path "dist/$archive" -DestinationPath "dist/$archive-portable.zip"
          Remove-Item -Recurse -Force "dist/$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Update manifest (latest.json)
        # Signs each update artifact with UPDATE_SIGNING_KEY (Ed25519); the app
        # only installs files signed by a key in dbclaw_core::update::TRUSTED_KEYS.
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "::error::UPDATE_SIGNING_KEY secret is missing (run scripts/setup-update-key.sh)"; exit 1; fi
          v="${GITHUB_REF_NAME#v}"
          a="db-claw-v$v"
          cargo run --release --locked -q -p dbclaw-release -- manifest \
            --version "$v" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --artifact "macos-arm64=app-tarball=dist/$a-macos-arm64.app.tar.gz" \
            --artifact "linux-x86_64=appimage=dist/$a-linux-x86_64.AppImage" \
            --artifact "windows-x86_64=installer=dist/$a-windows-x86_64-setup.exe" \
            > dist/latest.json
          cat dist/latest.json

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* $prerelease \
            --repo "$GITHUB_REPOSITORY" \
            --title "DB Claw $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
