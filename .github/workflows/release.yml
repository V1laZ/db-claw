name: Release

# Push a tag like v0.1.0 to build all platforms and publish a GitHub release.
# Run manually (workflow_dispatch) to just build and upload the artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libssl-dev libzstd-dev libasound2-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev

      - name: Test
        # Includes the control server: Unix socket / Windows named pipe (owner-only
        # DACL, squatting refused) and the WSL hand-off (Linux).
        run: cargo test --locked -p dbclaw-core -p dbclaw-control --features dbclaw-control/server

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p dbclaw-app -p dbclaw-control

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "archive=db-claw-v$v-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh target/${{ matrix.target }}/release ${{ steps.version.outputs.version }} dist/${{ steps.version.outputs.archive }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir=${{ steps.version.outputs.archive }}
          mkdir -p "dist/$dir"
          cp target/${{ matrix.target }}/release/dbclaw target/${{ matrix.target }}/release/dbclaw-ctl README.md "dist/$dir/"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          rm -rf "dist/$dir"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "${{ steps.version.outputs.archive }}"
          New-Item -ItemType Directory -Force -Path "dist/$dir" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dbclaw.exe", "target/${{ matrix.target }}/release/dbclaw-ctl.exe", "README.md" "dist/$dir/"
          Compress-Archive -Path "dist/$dir" -DestinationPath "dist/$dir.zip"
          Remove-Item -Recurse -Force "dist/$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DB Claw $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
