[package]
name = "dbclaw-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DB Claw — a fast native database manager for PostgreSQL and MongoDB"

[[bin]]
name = "dbclaw"
path = "src/main.rs"

[dependencies]
dbclaw-core = { path = "../dbclaw-core" }
dbclaw-drivers = { path = "../dbclaw-drivers" }
gpui-kit = { version = "0.10", features = ["tree-sitter-sql", "tree-sitter-javascript"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
bson.workspace = true
dirs = "6"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
