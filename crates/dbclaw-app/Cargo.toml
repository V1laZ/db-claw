[package]
name = "dbclaw-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DB Claw — a fast native database manager for PostgreSQL and MongoDB"

[[bin]]
name = "dbclaw"
path = "src/main.rs"

[dependencies]
dbclaw-core = { path = "../dbclaw-core" }
dbclaw-drivers = { path = "../dbclaw-drivers" }
dbclaw-control = { path = "../dbclaw-control", features = ["server"] }
gpui-kit = { version = "0.10", features = ["tree-sitter-sql", "tree-sitter-javascript"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
bson.workspace = true
dirs = "6"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
lsp-types = { version = "0.97", features = ["proposed"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
# Same versions gpui-kit pins; only used to switch on `test-support`, which
# provides offscreen render-to-image for the `screenshots` feature.
gpui-pre = { version = "=0.3.12", features = ["test-support"], optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
gpui-pre-platform = { version = "=0.3.12", default-features = false, features = ["test-support"], optional = true }

[features]
default = ["screenshots"]
# In-app window capture for `dbclaw-ctl screenshot` (macOS and Windows; gpui
# doesn't render to images on Linux yet).
screenshots = ["dep:gpui-pre", "dep:gpui-pre-platform"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder"] }
