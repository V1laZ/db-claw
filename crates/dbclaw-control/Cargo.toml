[package]
name = "dbclaw-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Automation protocol, CLI and MCP server for controlling a running DB Claw app"

[[bin]]
name = "dbclaw-ctl"
path = "src/bin/dbclaw-ctl.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
dirs = "6"
tokio = { workspace = true, features = ["net", "io-util"], optional = true }

[features]
# The app side (listener); the CLI only needs the client.
server = ["dep:tokio"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros"] }
