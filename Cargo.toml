[workspace]
resolver = "2"
members = ["crates/dbclaw-core", "crates/dbclaw-drivers", "crates/dbclaw-control", "crates/dbclaw-app", "crates/dbclaw-release"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
bson = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.dev]
# Keep the UI responsive in debug builds.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
